[plugins]
dir = "plugins"
enabled = ["linear", "discord"]
# To also enable the GitHub plugin (loop.plugins.github.GitHubPlugin),
# add "github" here and set GITHUB_TOKEN in .env:
#
#   enabled = ["linear", "github"]
#
#   [plugins.config.github]
#   repo = "tornadoslims/hermes-loop-r2"

[plugins.config.linear]
# team_key = "REA"  # optional; only required if the Linear workspace has
#                    # more than one team. Falls back to LINEAR_TEAM_KEY / .env.

[plugins.config.discord]
# webhook_url = "https://discord.com/api/webhooks/..."
# enabled = true

[pipeline]
schedule_build = "5m"
schedule_review = "5m"
