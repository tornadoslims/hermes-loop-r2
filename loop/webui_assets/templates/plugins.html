<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plugins — Hermes Loop r2</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="top-nav">
  <a href="/dashboard" class="nav-brand">
    <span class="logo">◈</span>
    Hermes Loop
    <span class="version">r2</span>
  </a>
  <div class="nav-links">
    <a href="/dashboard">Dashboard</a>
    <a href="/issues">Issues</a>
    <a href="/passes">Passes</a>
    <a href="/plugins" class="active">Plugins</a>
  </div>
  <div class="nav-status" id="nav-status">
    <span><span class="status-dot"></span> Engine running</span>
  </div>
</nav>

<aside class="sidebar">
  <div class="sidebar-section">
    <div class="sidebar-label">Overview</div>
    <a href="/dashboard" class="sidebar-link">
      <span class="icon">⊞</span> Dashboard
    </a>
    <a href="/issues" class="sidebar-link">
      <span class="icon">⊡</span> Issues
    </a>
    <a href="/passes" class="sidebar-link">
      <span class="icon">⟳</span> Passes
    </a>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-label">Configuration</div>
    <a href="/plugins" class="sidebar-link active">
      <span class="icon">⬡</span> Plugins
      <span class="badge" id="sidebar-plugin-count">—</span>
    </a>
  </div>
</aside>

<main class="main-content">
  <div class="page-header">
    <h1>Plugins</h1>
    <p>Loaded pipeline plugins and their health</p>
  </div>

  <!-- Plugin Cards -->
  <div class="card mb-md">
    <div class="card-header">
      <h2>Loaded Plugins</h2>
      <span class="card-subtitle" id="plugin-summary">Checking…</span>
    </div>
    <div class="plugin-grid" id="plugin-grid">
      <div class="plugin-card">
        <p class="text-muted text-sm">Loading plugin status…</p>
      </div>
    </div>
  </div>

  <!-- Health Table -->
  <div class="card">
    <div class="card-header">
      <h2>Plugin Health</h2>
      <span class="card-subtitle" id="health-summary">—</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Plugin</th>
            <th>Status</th>
            <th>Detail</th>
          </tr>
        </thead>
        <tbody id="health-tbody">
          <tr><td colspan="3" class="text-muted text-sm">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
const POLL_INTERVAL_MS = 8000;

function badgeFor(healthy, error) {
  if (healthy === true) return '<span class="badge badge-success">ok</span>';
  if (healthy === false) return '<span class="badge badge-danger">' + (error ? "error" : "degraded") + '</span>';
  return '<span class="badge badge-muted">disabled</span>';
}

function render(data) {
  const plugins = data.plugins || {};
  const names = Object.keys(plugins);
  document.getElementById("sidebar-plugin-count").textContent = names.length;

  const grid = document.getElementById("plugin-grid");
  if (names.length === 0) {
    grid.innerHTML = '<div class="plugin-card"><p class="text-muted text-sm">No plugins loaded</p></div>';
    document.getElementById("plugin-summary").textContent = "none loaded";
  } else {
    let healthy = 0;
    grid.innerHTML = names.map(name => {
      const p = plugins[name];
      if (p.healthy) healthy++;
      return '<div class="plugin-card">' +
        '<h3>⬡ ' + name + '</h3>' +
        '<div class="plugin-meta">' +
        badgeFor(p.healthy, p.error) +
        (p.error ? '<span class="text-sm text-muted">' + p.error + '</span>' : '') +
        '</div>' +
        '</div>';
    }).join("");
    document.getElementById("plugin-summary").textContent = names.length + " loaded";
    document.getElementById("health-summary").textContent = healthy + "/" + names.length + " healthy";
  }

  const tbody = document.getElementById("health-tbody");
  tbody.innerHTML = names.length
    ? names.map(name => {
        const p = plugins[name];
        return '<tr>' +
          '<td class="mono">' + name + '</td>' +
          '<td>' + badgeFor(p.healthy, p.error) + '</td>' +
          '<td class="text-muted text-sm">' + (p.error || "running normally") + '</td>' +
          '</tr>';
      }).join("")
    : '<tr><td colspan="3" class="text-muted text-sm">No plugins loaded</td></tr>';
}

function refresh() {
  fetch("/api/dashboard")
    .then(r => r.json())
    .then(render)
    .catch(err => console.error("plugins fetch failed:", err));
}

setInterval(refresh, POLL_INTERVAL_MS);
refresh();
</script>

</body>
</html>
