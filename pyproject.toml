[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-loop-r2"
version = "0.1.0"
description = "hermes-loop-r2: pluggable, self-hosted autonomous build/review daemon"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
loop = "loop.cli:main"

[tool.setuptools.packages.find]
include = ["loop*"]
